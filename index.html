<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaffleKraken</title>
  <meta name="description" content="WaffleKraken's site. Under construction.">
  <style>
    :root {
      --bg: #faf7f2;
      --fg: #1d1b19;
      --muted: #6b655d;
      --accent: #c46a1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161412;
        --fg: #ece7e0;
        --muted: #9a938a;
        --accent: #e8913f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 36rem; }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 8vw, 3.5rem);
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>WaffleKraken</h1>
    <p>This site is under construction. Check back soon.</p>
    <p><a href="https://github.com/WaffleKraken">github.com/WaffleKraken</a></p>
  </main>
</body>
</html>
